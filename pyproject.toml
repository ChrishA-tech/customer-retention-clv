[project]
name = "crc"
version = "1.0.0"
description = "Customer churn, lifetime value and retention targeting on real e-commerce data, with an API and a verified LLM analyst agent"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.26", "lightgbm>=4.0", "statsmodels>=0.14", "scikit-learn>=1.3", "lifetimes>=0.11", "lifelines>=0.27", "pyreadr", "openpyxl",
                "fastapi>=0.110", "uvicorn", "pydantic>=2", "httpx", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]
mlflow = ["mlflow-skinny>=2.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
